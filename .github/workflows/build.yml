name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix cmake zip lua5.1
      - name: Lua parses
        run: for f in addons/CompanionVoice/*.lua; do luac5.1 -p "$f"; done
      - name: Build and package
        run: ./package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: CoA64-Voices
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "Plugins\\LivingVoices64.dll and the Companion Voice add-on for CoA64. Install through AFK Realm's Voices page."
